<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contact · Durango Snow</title>
<meta name="description" content="Send a note about the Durango Snow forecast.">
<meta name="theme-color" content="#0a1024">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snow">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="../icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon.png">
<style>
:root{
  --bg:#0a1024;--bg2:#111a38;--card:#151f42;--card2:#1b2750;--line:#26335f;
  --text:#eef3ff;--muted:#8d9cc7;--dim:#5d6b96;--ice:#7dd3fc;
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--text);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  background:radial-gradient(1200px 500px at 50% -200px,#24346e 0%,transparent 70%),var(--bg);
  min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 28px}
header{display:flex;align-items:center;gap:12px;padding:6px 2px 12px}
header .logo{width:40px;height:40px;border-radius:11px;flex:none;box-shadow:0 4px 14px #0008}
header h1{font-size:22px;line-height:1.1;margin:0;letter-spacing:-.02em}
header .stamp{font-size:12.5px;color:var(--muted);margin-top:2px}
.back{
  margin-left:auto;flex:none;color:var(--text);text-decoration:none;font-size:13px;font-weight:600;
  padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);
}
.back:active{background:var(--card2)}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:14px;min-width:0}
.form{width:100%;overflow:hidden;border-radius:12px;background:#fff}
.form iframe{
  display:block;width:100%;height:1480px;border:0;background:#fff;
}
@media(max-width:420px){.form iframe{height:1680px}}
.fallback{margin:12px 2px 0;font-size:13px;color:var(--muted);text-align:center}
.fallback a{color:var(--ice);font-weight:600;text-decoration:none}
footer{color:var(--dim);font-size:12.5px;text-align:center;margin:26px 8px 6px;line-height:1.55}
footer a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="../icon.svg" alt="">
    <div>
      <h1>Contact</h1>
      <div class="stamp">Durango Snow</div>
    </div>
    <a class="back" href="../">← Forecast</a>
  </header>
  <section class="card">
    <div class="form">
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSesYGxdCq5a10pKo7-JrpaJhIDnj3TU58G3rfDqX03twF96fQ/viewform?embedded=true" title="Contact form">Loading…</iframe>
    </div>
    <p class="fallback">Form not showing? <a href="https://docs.google.com/forms/d/e/1FAIpQLSesYGxdCq5a10pKo7-JrpaJhIDnj3TU58G3rfDqX03twF96fQ/viewform" rel="noopener">Open it in a new page</a>.</p>
  </section>
  <footer>
    <a href="../">Forecast</a> · <a href="../accuracy/">Accuracy</a>
  </footer>
</div>
<script>window.goatcounter = {path: "/snow/contact/"}</script>
<script data-goatcounter="https://durangosnow.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
