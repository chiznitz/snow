name: Live data snapshot

on:
  schedule:
    # Every 2 hours: models update a few times a day, SNOTEL hourly
    - cron: "5 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/live.py
      - .github/workflows/live.yml

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build live.json
        run: python scripts/live.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- live.json; then
            echo "live.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          git commit -m "Update live data snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
