name: Forecast accuracy snapshot

on:
  schedule:
    # ~6 AM Mountain: 13:00 UTC is 6 AM MST / 7 AM MDT
    - cron: "0 13 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/accuracy.py
      - .github/workflows/accuracy.yml

permissions:
  contents: write

concurrency:
  group: accuracy
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Snapshot NWS forecasts and SNOTEL observations
        run: python scripts/accuracy.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/forecast-history.json data/observed-history.json; then
            echo "accuracy data unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast-history.json data/observed-history.json
          git commit -m "Update forecast accuracy snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
