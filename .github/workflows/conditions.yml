name: NWS discussions and avalanche forecasts

on:
  schedule:
    # Every 6 hours; offices issue AFDs around 4 AM and 4 PM local plus updates
    - cron: "20 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/conditions.py
      - .github/workflows/conditions.yml

permissions:
  contents: write

concurrency:
  group: conditions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build conditions.json
        run: python scripts/conditions.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- conditions.json; then
            echo "conditions.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conditions.json
          git commit -m "Update NWS and avalanche conditions"
          git pull --rebase origin main
          git push origin HEAD:main
