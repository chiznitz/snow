name: NWS forecast discussions

on:
  schedule:
    # Every 6 hours; offices issue AFDs around 4 AM and 4 PM local plus updates
    - cron: "20 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/afd.py
      - .github/workflows/afd.yml

permissions:
  contents: write

concurrency:
  group: afd
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build afd.json
        run: python scripts/afd.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- afd.json; then
            echo "afd.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add afd.json
          git commit -m "Update NWS forecast discussions"
          git pull --rebase origin main
          git push origin HEAD:main
