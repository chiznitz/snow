name: Snowfall map

on:
  schedule:
    # 11:40 and 23:40 UTC = 5:40 AM/PM MDT, 4:40 AM/PM MST, after the 06z/18z GFS and 00z/12z ECMWF land on Open-Meteo
    - cron: "40 11 * * *"
    - cron: "40 23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/snowmap.py
      - .github/workflows/snowmap.yml

permissions:
  contents: write

concurrency:
  group: snowmap
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build snowmap.json
        run: python scripts/snowmap.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- snowmap.json; then
            echo "snowmap.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snowmap.json
          git commit -m "Update snowfall map"
          git pull --rebase origin main
          git push origin HEAD:main
