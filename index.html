<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Durango Snow</title>
<meta name="description" content="Live SNOTEL snowpack and elevation-adjusted snow forecasts for the San Juans around Durango, CO.">
<meta name="theme-color" content="#0a1024">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#0a1024;--bg2:#111a38;--card:#151f42;--card2:#1b2750;--line:#26335f;
  --text:#eef3ff;--muted:#8d9cc7;--dim:#5d6b96;
  --ice:#7dd3fc;--rain:#2dd4bf;--warn:#fbbf24;--bad:#fb7185;--good:#4ade80;
  --s0:#334066;--s1:#60a5fa;--s2:#3b82f6;--s3:#6366f1;--s4:#a855f7;--s5:#e879f9;--s6:#f472b6;
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--text);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  background:radial-gradient(1200px 500px at 50% -200px,#24346e 0%,transparent 70%),var(--bg);
  min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.wrap{max-width:1180px;margin:0 auto;padding:14px 14px 28px}
header{display:flex;align-items:center;gap:12px;padding:6px 2px 12px}
header .logo{width:40px;height:40px;border-radius:11px;flex:none;box-shadow:0 4px 14px #0008}
header h1{font-size:22px;line-height:1.1;margin:0;letter-spacing:-.02em}
header .stamp{font-size:12.5px;color:var(--muted);margin-top:2px}
header .stamp.err{color:var(--warn)}
.refresh{
  margin-left:auto;flex:none;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line);background:var(--card);color:var(--text);
  display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.refresh:active{transform:scale(.94)}
.refresh svg{width:22px;height:22px}
.refresh.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.banner{
  border-radius:18px;padding:14px 16px;margin-bottom:18px;
  background:linear-gradient(135deg,#3b2a8a 0%,#6d28d9 45%,#c026d3 100%);
  box-shadow:0 10px 30px #6d28d955;position:relative;overflow:hidden;
}
.banner:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:#fff1}
.banner .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.8;font-weight:600}
.banner .h{font-size:21px;font-weight:750;margin:3px 0 8px;letter-spacing:-.01em}
.banner .chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#ffffff1f;border-radius:999px;padding:4px 10px;font-size:12.5px;white-space:nowrap}
.chip b{font-weight:700}

h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:20px 4px 10px;font-weight:650;display:flex;justify-content:space-between;align-items:baseline}
h2.sec small{text-transform:none;letter-spacing:0;font-weight:400;color:var(--dim);font-size:12px}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:760px){.grid.two{grid-template-columns:1fr 1fr}}

.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:14px;min-width:0}
.card .top{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.card h3{margin:0;font-size:19px;letter-spacing:-.01em}
.card .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.badge{margin-left:auto;font-size:11px;font-weight:650;border-radius:999px;padding:3px 9px;background:#ffffff12;color:var(--muted);white-space:nowrap}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#0b1330;border-radius:12px;padding:10px 11px}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-size:38px;font-weight:750;letter-spacing:-.03em;line-height:1.05;margin:2px 0 3px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:20px;font-weight:600;margin-left:1px}
.chg{display:flex;gap:10px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chg b{font-weight:650}
.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--muted)}
.spark{margin-top:10px;background:#0b1330;border-radius:12px;padding:8px 10px 6px}
.spark .row{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.spark svg{display:block;width:100%;height:46px;margin:4px 0}
.asof{font-size:11.5px;color:var(--dim);margin-top:8px}

.totals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.totals .stat .v{font-size:40px}
.chart{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px;scrollbar-width:none}
.chart::-webkit-scrollbar{display:none}
.days{display:flex;min-width:max-content;position:relative}
.day{width:38px;flex:none;text-align:center;font-variant-numeric:tabular-nums;position:relative;padding:0 1px}
.day.sep{border-left:1px dashed #3a4778}
.day.far{opacity:.55}
.day .amt{font-size:11px;font-weight:700;height:15px;line-height:15px}
.day .amt.z{color:var(--dim);font-weight:500}
.day .barbox{height:84px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border-bottom:1px solid var(--line)}
.day .bar{width:24px;border-radius:5px 5px 2px 2px;min-height:2px}
.day .rain{font-size:10px;color:var(--rain);height:14px;line-height:14px;margin-top:3px;white-space:nowrap;font-weight:600}
.drop{display:inline-block;width:6px;height:6px;background:var(--rain);border-radius:0 50% 50% 50%;transform:rotate(45deg);margin-right:3px;vertical-align:1px}
.day .dow{font-size:11.5px;color:var(--muted);margin-top:2px}
.day .dow.we{color:var(--text);font-weight:700}
.day .dt{font-size:13px;font-weight:650}
.day.today .dt{color:var(--ice)}
.day.today .dow{color:var(--ice);font-weight:700}
.day .hi{font-size:11.5px;margin-top:4px;color:#fca5a5}
.day .lo{font-size:11.5px;color:#93c5fd}
.seglbl{display:flex;min-width:max-content;font-size:11px;color:var(--dim);margin-bottom:2px}
.seglbl span{flex:none;text-align:center;border-bottom:2px solid var(--line);padding-bottom:2px;margin:0 2px}
.legend{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--dim);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:8px;border-radius:2px}

.skel{position:relative;overflow:hidden;background:#0b1330;border-radius:12px}
.skel:after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,#ffffff0d,transparent);animation:sh 1.3s infinite}
@keyframes sh{to{transform:translateX(100%)}}
.error{background:#3a1626;border:1px solid #7f1d3a;color:#fecdd3;border-radius:12px;padding:12px;font-size:13.5px}
.error b{display:block;color:#fff;margin-bottom:3px}
.error button{margin-top:8px;background:#fb7185;color:#2a0a14;border:0;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px;cursor:pointer}

footer{color:var(--dim);font-size:12.5px;text-align:center;margin:26px 8px 6px;line-height:1.55}
footer a{color:var(--muted)}
footer .ask{color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="icon.svg" alt="">
    <div>
      <h1>Durango Snow</h1>
      <div class="stamp" id="stamp">Loading live data…</div>
    </div>
    <button class="refresh" id="refresh" aria-label="Refresh data" title="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </header>

  <div class="banner" id="banner">
    <div class="k">16-day outlook</div>
    <div class="h">Checking the forecast…</div>
    <div class="chips"></div>
  </div>

  <h2 class="sec">Snowpack now <small>NRCS SNOTEL · hourly</small></h2>
  <div class="grid two" id="snotel"></div>

  <h2 class="sec">Snow forecast <small>Open-Meteo · elevation-adjusted</small></h2>
  <div class="grid two" id="forecast"></div>

  <footer>
    Data from <a href="https://www.nrcs.usda.gov/wps/portal/wcc/home/" rel="noopener">NRCS SNOTEL</a> and
    <a href="https://open-meteo.com/" rel="noopener">Open-Meteo</a>. Snow and rain in inches, temperatures in °F.
    <div class="ask">Ask Homestar "check snotel" or "snow forecast" for a summary.</div>
  </footer>
</div>

<script>
"use strict";
const SNOTEL = [
  {id:"sharkstooth", name:"Sharkstooth", triplet:"1060:CO:SNTL", ft:"10,730 ft", note:"La Plata Mtns"},
  {id:"molas", name:"Molas Pass", triplet:"632:CO:SNTL", ft:"10,610 ft", note:"SNOTEL: Molas Lake"},
];
const FORECAST = [
  {id:"sharkstooth", name:"Sharkstooth", lat:37.50356, lon:-108.11405, m:3271, ft:"10,730 ft"},
  {id:"molas", name:"Molas Pass", lat:37.74929, lon:-107.68933, m:3236, ft:"10,610 ft"},
  {id:"wolf", name:"Wolf Creek", lat:37.4747, lon:-106.7932, m:3353},
  {id:"purg", name:"Purgatory", lat:37.6303, lon:-107.8140, m:3146},
];
const TZ = "America/Denver";
const HOUR = 36e5;
const SNOW_SCALE = [[0.05,"--s0"],[1,"--s1"],[3,"--s2"],[6,"--s3"],[12,"--s4"],[18,"--s5"],[Infinity,"--s6"]];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["S","M","T","W","T","F","S"];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(2, "0");
const snowColor = v => `var(${(SNOW_SCALE.find(([max]) => v < max) || SNOW_SCALE[6])[1]})`;
const fmtIn = v => v == null || !isFinite(v) ? "—" : v < 0.05 ? "0" : v < 1 ? v.toFixed(1) : String(Math.round(v));
const fmtDelta = v => v == null ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(+v.toFixed(1)) + '"';
const deltaCls = v => v == null || Math.abs(v) < 0.05 ? "flat" : v > 0 ? "up" : "down";
const mtTime = ms => new Date(ms).toLocaleString("en-US", {timeZone:TZ, weekday:"short", hour:"numeric", minute:"2-digit"});

// Calendar dates ("2026-10-21") are handled as UTC midnight so the browser's own zone never shifts them.
const ymd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const shortDate = s => { const d = ymd(s); return `${MON[d.getUTCMonth()]} ${d.getUTCDate()}`; };
const dayLabel = s => s === todayMT() ? "today" : shortDate(s);
const todayMT = () => new Intl.DateTimeFormat("en-CA", {timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit"}).format(new Date());

async function getJSON(url, timeoutMs = 20000) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    const r = await fetch(url, {signal:ctl.signal, cache:"no-store"});
    if (!r.ok) throw new Error(`HTTP ${r.status} from ${new URL(url).host}`);
    return await r.json();
  } catch (e) {
    if (e.name === "AbortError") throw new Error(`Timed out reaching ${new URL(url).host}`);
    if (e instanceof TypeError) throw new Error(`Network error reaching ${new URL(url).host}`);
    throw e;
  } finally { clearTimeout(t); }
}

function errorBox(title, err, retryFn) {
  const box = document.createElement("div");
  box.className = "error";
  box.innerHTML = `<b>${esc(title)}</b>${esc(err && err.message || err)}<br><button type="button">Try again</button>`;
  box.querySelector("button").onclick = retryFn;
  return box;
}

function cardShell(host, id, title, sub, badge) {
  let el = $(id);
  if (!el) { el = document.createElement("section"); el.className = "card"; el.id = id; host.appendChild(el); }
  el.innerHTML = `<div class="top"><div><h3>${esc(title)}</h3><div class="sub">${esc(sub)}</div></div>${badge ? `<span class="badge">${esc(badge)}</span>` : ""}</div><div class="body"></div>`;
  return el.querySelector(".body");
}

/* ---------------- SNOTEL ---------------- */

// AWDB timestamps are Pacific Standard Time year-round (UTC−8, no DST).
const PST_OFFSET = -8 * HOUR;
const awdbFmt = ms => { const d = new Date(ms + PST_OFFSET); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:00`; };
const awdbParse = s => { const [a, b = "00:00"] = s.split(" "); const [y, m, d] = a.split("-").map(Number); const [hh, mm] = b.split(":").map(Number); return Date.UTC(y, m - 1, d, hh, mm) - PST_OFFSET; };

function series(values) {
  return (values || []).filter(v => v && v.value != null && isFinite(v.value)).map(v => ({t:awdbParse(v.date), v:+v.value})).sort((a, b) => a.t - b.t);
}
function changeOver(s, hours) {
  if (!s.length) return null;
  const last = s[s.length - 1], cutoff = last.t - hours * HOUR;
  let ref = null;
  for (const p of s) { if (p.t <= cutoff) ref = p; else break; }
  if (!ref || last.t - ref.t > (hours + 3) * HOUR) return null;
  return last.v - ref.v;
}

function sparkline(s, now) {
  const W = 300, H = 46, start = now - 48 * HOUR;
  const pts = s.filter(p => p.t >= start);
  if (pts.length < 2) return `<svg viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H/2+4}" fill="#5d6b96" font-size="12" text-anchor="middle">Not enough hourly data</text></svg>`;
  const lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  const span = Math.max(hi - lo, 2);
  const base = lo - (span - (hi - lo)) / 2;
  const x = t => ((t - start) / (now - start)) * W;
  const y = v => H - 4 - ((v - base) / span) * (H - 10);
  const line = pts.map(p => `${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  const last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Snow depth, last 48 hours">
    <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc" stop-opacity=".45"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></linearGradient></defs>
    <polygon points="${x(pts[0].t).toFixed(1)},${H} ${line} ${x(last.t).toFixed(1)},${H}" fill="url(#sg)"/>
    <polyline points="${line}" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(last.t).toFixed(1)}" cy="${y(last.v).toFixed(1)}" r="3.5" fill="#fff" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

const snotelState = {};

async function loadSnotel(st) {
  const body = cardShell($("snotel"), "sn-" + st.id, st.name, `${st.ft} · ${st.note}`, "SNOTEL");
  body.innerHTML = `<div class="skel" style="height:190px"></div>`;
  try {
    const now = Date.now();
    const url = "https://wcc.sc.egov.usda.gov/awdbRestApi/services/v1/data"
      + `?stationTriplets=${st.triplet}&elements=SNWD,WTEQ&duration=HOURLY`
      + `&beginDate=${encodeURIComponent(awdbFmt(now - 50 * HOUR))}&endDate=${encodeURIComponent(awdbFmt(now + HOUR))}`;
    const json = await getJSON(url);
    const rec = Array.isArray(json) && json.find(r => r.stationTriplet === st.triplet) || (Array.isArray(json) ? json[0] : null);
    if (!rec || !Array.isArray(rec.data)) throw new Error("SNOTEL returned no data for this station.");
    const el = {};
    rec.data.forEach(d => { el[d.stationElement.elementCode] = series(d.values); });
    const depth = el.SNWD || [], swe = el.WTEQ || [];
    if (!depth.length && !swe.length) throw new Error("No hourly readings in the last 48 hours (station may be offline).");
    const dl = depth[depth.length - 1], wl = swe[swe.length - 1];
    const asOf = Math.max(dl ? dl.t : 0, wl ? wl.t : 0);
    const stale = now - asOf > 6 * HOUR;
    const d6 = changeOver(depth, 6), d24 = changeOver(depth, 24), w6 = changeOver(swe, 6), w24 = changeOver(swe, 24);
    snotelState[st.id] = {name:st.name, depth:dl && dl.v, d24};
    body.innerHTML = `
      <div class="stats">
        <div class="stat"><div class="l">Snow depth</div><div class="v" style="color:${dl ? snowColor(dl.v) : "inherit"}">${dl ? Math.round(dl.v) : "—"}<small>"</small></div>
          <div class="chg"><span>6h <b class="${deltaCls(d6)}">${fmtDelta(d6)}</b></span><span>24h <b class="${deltaCls(d24)}">${fmtDelta(d24)}</b></span></div></div>
        <div class="stat"><div class="l">SWE</div><div class="v">${wl ? wl.v.toFixed(1) : "—"}<small>"</small></div>
          <div class="chg"><span>6h <b class="${deltaCls(w6)}">${fmtDelta(w6)}</b></span><span>24h <b class="${deltaCls(w24)}">${fmtDelta(w24)}</b></span></div></div>
      </div>
      <div class="spark"><div class="row"><span>Depth · last 48h</span><span>${dl ? Math.round(dl.v) + '" now' : ""}</span></div>${sparkline(depth, asOf || now)}<div class="row"><span>48h ago</span><span>24h</span><span>now</span></div></div>
      <div class="asof">${stale ? "⚠ Stale · " : ""}Last reading ${mtTime(asOf)} MT</div>`;
    return true;
  } catch (e) {
    delete snotelState[st.id];
    body.innerHTML = "";
    body.appendChild(errorBox("Couldn't load SNOTEL data", e, () => loadSnotel(st).then(updateBanner)));
    return false;
  }
}

/* ---------------- Forecast ---------------- */

const UNIT_TO_IN = {inch:1, in:1, cm:1/2.54, mm:1/25.4};
const toInches = (arr, unit) => {
  const k = UNIT_TO_IN[unit];
  if (k == null) throw new Error(`Unexpected unit "${unit}" from Open-Meteo.`);
  return arr.map(v => v == null ? null : v * k);
};
const sum = (a, i, j) => a.slice(i, j).reduce((s, v) => s + (v || 0), 0);
const fcState = {};

function storms(fc) {
  const out = [];
  let cur = null;
  fc.time.forEach((t, i) => {
    const s = fc.snow[i] || 0;
    if (s >= 0.1) { if (!cur) cur = {start:i, end:i, total:0}; cur.end = i; cur.total += s; }
    else if (cur) { out.push(cur); cur = null; }
  });
  if (cur) out.push(cur);
  return out;
}
function rangeLabel(time, a, b) {
  const s = dayLabel(time[a]), e = shortDate(time[b]);
  if (a === b) return s;
  if (s === "today") return `today–${e}`;
  return s.slice(0, 3) === e.slice(0, 3) ? `${s}–${e.slice(4)}` : `${s}–${e}`;
}

async function loadForecast(loc) {
  const body = cardShell($("forecast"), "fc-" + loc.id, loc.name, `Forecast for ${loc.ft || Math.round(loc.m * 3.28084).toLocaleString() + " ft"}`, "Forecast");
  body.innerHTML = `<div class="skel" style="height:92px;margin-bottom:10px"></div><div class="skel" style="height:170px"></div>`;
  try {
    const url = "https://api.open-meteo.com/v1/forecast"
      + `?latitude=${loc.lat}&longitude=${loc.lon}&elevation=${loc.m}`
      + "&daily=snowfall_sum,precipitation_sum,rain_sum,temperature_2m_max,temperature_2m_min"
      + "&forecast_days=16&timezone=America%2FDenver&precipitation_unit=inch&temperature_unit=fahrenheit";
    const json = await getJSON(url);
    if (json.error) throw new Error(json.reason || "Open-Meteo returned an error.");
    const d = json.daily, u = json.daily_units || {};
    if (!d || !Array.isArray(d.time) || !d.time.length || !Array.isArray(d.snowfall_sum)) throw new Error("Open-Meteo response had no daily forecast.");
    // With precipitation_unit=inch Open-Meteo already returns snowfall in inches; trust daily_units, never assume.
    const fc = {
      name: loc.name, time: d.time,
      snow: toInches(d.snowfall_sum, u.snowfall_sum),
      rain: d.rain_sum ? toInches(d.rain_sum, u.rain_sum) : d.time.map(() => null),
      hi: d.temperature_2m_max || [], lo: d.temperature_2m_min || [],
    };
    fcState[loc.id] = fc;
    renderForecast(body, fc);
    return true;
  } catch (e) {
    delete fcState[loc.id];
    body.innerHTML = "";
    body.appendChild(errorBox("Couldn't load the forecast", e, () => loadForecast(loc).then(updateBanner)));
    return false;
  }
}

function renderForecast(body, fc) {
  const n1 = sum(fc.snow, 0, 5), n2 = sum(fc.snow, 5, 10);
  const r1 = sum(fc.rain, 0, 5), r2 = sum(fc.rain, 5, 10);
  const scaleMax = Math.max(8, ...fc.snow.map(v => v || 0));
  const today = todayMT();
  const W = 38;
  const days = fc.time.map((t, i) => {
    const s = fc.snow[i], r = fc.rain[i] || 0, dt = ymd(t), dow = dt.getUTCDay();
    const h = s == null ? 0 : Math.max(2, Math.sqrt(s / scaleMax) * 84);
    const cls = ["day", i === 5 || i === 10 ? "sep" : "", i >= 10 ? "far" : "", t === today ? "today" : ""].join(" ");
    const hi = fc.hi[i], lo = fc.lo[i];
    return `<div class="${cls}" title="${shortDate(t)}: ${s == null ? "n/a" : s.toFixed(1) + '" snow'}${r >= 0.01 ? `, ${r.toFixed(2)}" rain` : ""}">
      <div class="amt ${!s || s < 0.05 ? "z" : ""}" style="${s >= 0.05 ? `color:${snowColor(s)}` : ""}">${s == null ? "–" : fmtIn(s)}</div>
      <div class="barbox"><div class="bar" style="height:${h.toFixed(1)}px;background:${s >= 0.05 ? snowColor(s) : "var(--s0)"}"></div></div>
      <div class="rain">${r >= 0.05 ? `<span class="drop"></span>${r.toFixed(1)}` : ""}</div>
      <div class="dow ${dow === 0 || dow === 6 ? "we" : ""}">${t === today ? "Today" : DOW[dow]}</div>
      <div class="dt">${dt.getUTCDate()}</div>
      <div class="hi">${hi == null ? "–" : Math.round(hi) + "°"}</div>
      <div class="lo">${lo == null ? "–" : Math.round(lo) + "°"}</div>
    </div>`;
  }).join("");
  const segs = [[0, 5, "Next 1–5 days"], [5, 10, "Days 6–10"], [10, fc.time.length, "Days 11–16"]]
    .filter(([a, b]) => b > a)
    .map(([a, b, l]) => `<span style="width:${(b - a) * W - 4}px">${l} · ${fmtIn(sum(fc.snow, a, b))}"</span>`).join("");
  const rainNote = (r, s) => r >= 0.1 && r > s / 10 ? ` · <span style="color:var(--rain)">${r.toFixed(1)}" rain</span>` : "";
  body.innerHTML = `
    <div class="totals">
      <div class="stat"><div class="l">Next 1–5 days</div><div class="v" style="color:${n1 >= 0.05 ? snowColor(n1) : "inherit"}">${fmtIn(n1)}<small>"</small></div>
        <div class="chg">${rangeLabel(fc.time, 0, 4).replace(/^today/, "Today")}${rainNote(r1, n1)}</div></div>
      <div class="stat"><div class="l">Days 6–10</div><div class="v" style="color:${n2 >= 0.05 ? snowColor(n2) : "inherit"}">${fmtIn(n2)}<small>"</small></div>
        <div class="chg">${fc.time[9] ? rangeLabel(fc.time, 5, 9) : ""}${rainNote(r2, n2)}</div></div>
    </div>
    <div class="chart"><div class="seglbl">${segs}</div><div class="days">${days}</div></div>
    <div class="legend">Snow:
      <i style="background:var(--s1)"></i>&lt;1" <i style="background:var(--s2)"></i>1–3 <i style="background:var(--s3)"></i>3–6
      <i style="background:var(--s4)"></i>6–12 <i style="background:var(--s5)"></i>12–18 <i style="background:var(--s6)"></i>18+
      <span><span class="drop" style="margin-left:6px"></span>rain</span><span style="margin-left:auto">High / low °F</span></div>`;
}

/* ---------------- Banner ---------------- */

function updateBanner() {
  const b = $("banner"), fcs = Object.values(fcState);
  const chips = [];
  if (!fcs.length) {
    b.querySelector(".h").textContent = Object.keys(snotelState).length ? "Forecast unavailable right now" : "Loading…";
  } else {
    let best = null;
    for (const fc of fcs) for (const s of storms(fc)) if (!best || s.total > best.total) best = {...s, fc};
    b.querySelector(".h").textContent = best && best.total >= 0.5
      ? `Biggest storm: ${best.fc.name}, ${fmtIn(best.total)}" ${rangeLabel(best.fc.time, best.start, best.end)}`
      : "No significant snow in the 16-day forecast";
    let next = null;
    for (const fc of fcs) for (const s of storms(fc)) if (s.start > 0 && (!next || s.total > next.total)) next = {...s, fc};
    if (next && next.total >= 0.5 && best && best.start === 0)
      chips.push(`Next storm: <b>${esc(next.fc.name)} ${fmtIn(next.total)}"</b> ${rangeLabel(next.fc.time, next.start, next.end)}`);
    const top5 = fcs.map(fc => ({fc, v:sum(fc.snow, 0, 5)})).sort((a, c) => c.v - a.v)[0];
    if (top5 && top5.v >= 0.05) chips.push(`Next 5 days: <b>${esc(top5.fc.name)} ${fmtIn(top5.v)}"</b>`);
  }
  for (const s of Object.values(snotelState)) {
    if (s.depth != null) chips.push(`${esc(s.name)} base <b>${Math.round(s.depth)}"</b>${s.d24 != null && Math.abs(s.d24) >= 0.5 ? ` (${fmtDelta(s.d24)} 24h)` : ""}`);
  }
  b.querySelector(".chips").innerHTML = chips.map(c => `<span class="chip">${c}</span>`).join("");
}

/* ---------------- Boot ---------------- */

let loading = false, lastLoad = 0;
async function loadAll() {
  if (loading) return;
  loading = true;
  const btn = $("refresh"), stamp = $("stamp");
  btn.classList.add("spin");
  stamp.classList.remove("err");
  stamp.textContent = "Updating…";
  const jobs = [
    ...SNOTEL.map(st => loadSnotel(st).then(ok => (updateBanner(), ok))),
    ...FORECAST.map(loc => loadForecast(loc).then(ok => (updateBanner(), ok))),
  ];
  const results = await Promise.all(jobs);
  const failed = results.filter(ok => !ok).length;
  lastLoad = Date.now();
  stamp.textContent = `Updated ${new Date(lastLoad).toLocaleTimeString("en-US", {timeZone:TZ, hour:"numeric", minute:"2-digit"})} MT`
    + (failed ? ` · ${failed} of ${results.length} sources failed` : "");
  if (failed) stamp.classList.add("err");
  btn.classList.remove("spin");
  loading = false;
}

$("refresh").addEventListener("click", loadAll);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && Date.now() - lastLoad > 15 * 60 * 1000) loadAll();
});
loadAll();
</script>
</body>
