<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>Snow</title>
<style>body{font-family:-apple-system,system-ui,sans-serif;background:#eef3f8;margin:0;padding:14px;color:#123}h1{font-size:22px;margin:4px 0}section{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 1px 4px #0002}h2{margin:0 0 10px;font-size:19px}h2 small{color:#789;font-weight:400;font-size:13px}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g div{background:#f3f7fb;border-radius:10px;padding:10px;font-size:13px}.g b{display:block;font-size:26px}i{color:#357}.bars{display:flex;gap:3px;align-items:flex-end;margin-top:12px}.d{flex:1;text-align:center;font-size:10px}.b{background:#5a8fd8;border-radius:3px 3px 0 0;min-height:1px}.d small{color:#789;display:block}.m,footer{color:#789;font-size:12px}</style></head><body>
<h1>❄️ High-Country Snow</h1><div class=m id=u>Loading…</div><div id=c></div>
<footer>Free data from NRCS SNOTEL and the Open-Meteo forecast (adjusted for elevation). Snow is in inches. Ask Homestar "check snotel" or "snow forecast" for a summary.</footer>
<script>
const S=[["Sharkstooth","1060:CO:SNTL",37.50356,-108.11405,3271,"10,730 ft"],["Molas Pass","632:CO:SNTL",37.74929,-107.68933,3236,"10,610 ft"]];
const p=n=>String(n).padStart(2,"0"),f=d=>`${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:00`;
const pst=new Date(Date.now()-8*36e5),beg=new Date(pst-12*36e5);
const sg=v=>v==null?"—":(v>=0?"+":"")+(+v.toFixed(1))+'"';
function l6(s){if(!s.length)return[null,null,null];const L=s[s.length-1],t=new Date(L.date.replace(" ","T")+"Z");const q=s.filter(v=>new Date(v.date.replace(" ","T")+"Z")<=t-6*36e5);return[L.value,q.length?L.value-q[q.length-1].value:null,new Date(+t+8*36e5)]}
(async()=>{let h="";for(const[n,t,la,lo,el,ft]of S){try{
const d=(await(await fetch(`https://wcc.sc.egov.usda.gov/awdbRestApi/services/v1/data?stationTriplets=${t}&elements=SNWD,WTEQ&duration=HOURLY&beginDate=${encodeURIComponent(f(beg))}&endDate=${encodeURIComponent(f(pst))}`)).json())[0].data;
const o={};d.forEach(x=>o[x.stationElement.elementCode]=(x.values||[]).filter(v=>v.value!=null));
const[sd,sdc,ts]=l6(o.SNWD||[]),[sw,swc]=l6(o.WTEQ||[]);
const F=(await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&elevation=${el}&daily=snowfall_sum,precipitation_sum&forecast_days=10&timezone=America%2FDenver&precipitation_unit=inch`)).json()).daily;
const sn=F.snowfall_sum.map(x=>x/2.54),sum=(a,i,j)=>a.slice(i,j).reduce((x,y)=>x+y,0);
const bars=F.time.map((d,i)=>{const dt=new Date(d+"T12:00");return`<div class=d><div class=b style="height:${Math.min(60,sn[i]*8)}px"></div><span>${sn[i].toFixed(1)}</span><small>${dt.toLocaleDateString("en-US",{weekday:"short"})}<br>${dt.getDate()}</small></div>`}).join("");
h+=`<section><h2>${n} <small>${ft}</small></h2><div class=g><div><b>${sd??"—"}"</b>Snow depth<br><i>${sg(sdc)} 6h</i></div><div><b>${sw??"—"}"</b>SWE<br><i>${sg(swc)} 6h</i></div><div><b>${sum(sn,0,5).toFixed(0)}"</b>Snow days 1–5<br><i>${sum(F.precipitation_sum,0,5).toFixed(2)}" precip</i></div><div><b>${sum(sn,5,10).toFixed(0)}"</b>Snow days 6–10<br><i>${sum(F.precipitation_sum,5,10).toFixed(2)}" precip</i></div></div><div class=bars>${bars}</div><p class=m>SNOTEL as of ${ts?ts.toLocaleString("en-US",{timeZone:"America/Denver",weekday:"short",hour:"numeric"}):"—"} MT</p></section>`;
}catch(e){h+=`<section><h2>${n}</h2>Couldn't load data.</section>`}}
document.getElementById("c").innerHTML=h;document.getElementById("u").textContent="Updated "+new Date().toLocaleString("en-US",{timeZone:"America/Denver"})+" MT";})();
</script></body></html>
